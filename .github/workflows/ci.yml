name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  js-and-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Install dependencies
        run: npm install
      - name: Lint and JS tests
        run: npm test
      - name: Package dry run
        run: npm run pack:check

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORDOVA_ANDROID_VERSION: 13.0.0
      JAVA_VERSION: '17'
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS: '34.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Install Cordova CLI
        run: npm install -g cordova@12
      - name: Build Android sample app
        run: |
          tmpdir="$(mktemp -d)"
          cordova create "$tmpdir/app" com.example.geofence.ci GeofenceCi
          cd "$tmpdir/app"
          cordova platform add android@${CORDOVA_ANDROID_VERSION}
          cordova plugin add "$GITHUB_WORKSPACE"
          cordova build android -- --packageType=apk
          (cd platforms/android && ./gradlew test --no-daemon)

  ios-compile:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CORDOVA_IOS_VERSION: 8.0.0
      XCODE_VERSION: '16.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app
      - name: Install dependencies
        run: npm install
      - name: Install Cordova CLI
        run: npm install -g cordova@12
      - name: Compile iOS sample app
        run: |
          tmpdir="$(mktemp -d)"
          cordova create "$tmpdir/app" com.example.geofence.ci GeofenceCi
          cd "$tmpdir/app"
          cordova platform add ios@${CORDOVA_IOS_VERSION}
          cordova plugin add "$GITHUB_WORKSPACE"
          cordova build ios --no-sign
